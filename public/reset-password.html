<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EduMitra</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:#f4f1ea;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif;padding:24px 16px}
    .card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.10);padding:48px 40px 40px;width:100%;max-width:420px}
    .logo-name{font-size:22px;font-weight:700;color:#0a1628;margin-bottom:4px}
    .logo-sub{font-size:11px;color:#888;margin-bottom:32px}
    h1{font-size:20px;font-weight:700;color:#0a1628;margin-bottom:8px}
    p.sub{font-size:14px;color:#666;margin-bottom:28px;line-height:1.5}
    label{display:block;font-size:13px;font-weight:600;color:#0a1628;margin-bottom:6px}
    input{width:100%;padding:12px 14px;border:1.5px solid #d1ccc4;border-radius:8px;font-size:15px;color:#0a1628;outline:none;margin-bottom:20px}
    input:focus{border-color:#0a1628}
    button{width:100%;padding:13px;background:#0a1628;color:#faf7f2;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .alert{padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:20px;display:none}
    .error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;display:block}
    .success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;display:block}
    .back{display:block;text-align:center;margin-top:20px;font-size:13px;color:#0a1628;text-decoration:none;opacity:.7}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-name">EduMitra</div>
    <div class="logo-sub">by Funds And Toil Private Limited</div>
    <h1>Set a new password</h1>
    <p class="sub">Enter your new password below. It must be at least 8 characters.</p>
    <div class="alert" id="alert"></div>
    <div id="form-area">
      <label for="pass">New password</label>
      <input type="password" id="pass" placeholder="At least 8 characters">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" placeholder="Same password again">
      <button id="btn" onclick="doReset()">Set new password</button>
    </div>
    <a class="back" href="/">Back to EduMitra</a>
  </div>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.getElementById('alert').className='alert error';
      document.getElementById('alert').textContent='Invalid reset link. Please request a new one.';
      document.getElementById('form-area').style.display='none';
    }
    async function doReset() {
      const pass=document.getElementById('pass').value;
      const confirm=document.getElementById('confirm').value;
      const alert=document.getElementById('alert');
      const btn=document.getElementById('btn');
      alert.className='alert'; alert.textContent='';
      if(pass.length<8){alert.className='alert error';alert.textContent='Password must be at least 8 characters.';return;}
      if(pass!==confirm){alert.className='alert error';alert.textContent='Passwords do not match.';return;}
      btn.disabled=true; btn.textContent='Saving...';
      try {
        const res=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pass})});
        const data=await res.json();
        if(!res.ok){alert.className='alert error';alert.textContent=data.error||'Something went wrong.';btn.disabled=false;btn.textContent='Set new password';return;}
        alert.className='alert success';alert.textContent='Password updated! Redirecting to sign in...';
        document.getElementById('form-area').style.display='none';
        setTimeout(()=>{window.location.href='/';},2500);
      } catch(e){alert.className='alert error';alert.textContent='Could not reach the server.';btn.disabled=false;btn.textContent='Set new password';}
    }
  </script>
</body>
</html>
