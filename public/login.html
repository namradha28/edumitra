<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — EduMitra</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0a1628;
  --navy-mid:#1a2d4a;
  --gold:#c9a84c;
  --cream:#faf7f2;
  --sand:#f4f1ea;
  --green:#16a34a;
  --green-bg:#f0fdf4;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --blue:#2563eb;
  --blue-bg:#eff6ff;
  --purple:#7c3aed;
  --purple-bg:#f5f3ff;
  --border:#e5e0d8;
  --muted:#6b7280;
}

body{
  font-family:'Segoe UI',system-ui,Arial,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;transition:background .4s ease;
  background:linear-gradient(135deg,var(--navy) 0%,#1a2d4a 100%);
}

/* ── Background themes per role ── */
body.role-student{background:linear-gradient(135deg,#0a2818 0%,#16a34a 100%)}
body.role-counsellor{background:linear-gradient(135deg,#1e1b4b 0%,#7c3aed 100%)}
body.role-admin, body.role-superadmin{background:linear-gradient(135deg,#1c0a00 0%,#c8953a 100%)}

/* ── Card ── */
.card{
  background:#fff;border-radius:20px;padding:44px 40px;
  width:100%;max-width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,.35);
  transition:all .3s ease;
}

/* ── Logo ── */
.logo{font-size:26px;font-weight:800;color:var(--navy);margin-bottom:4px}
.logo span{color:var(--gold)}
.tagline{font-size:13px;color:var(--muted);margin-bottom:32px}

/* ── Role indicator ── */
.role-indicator{
  display:none;align-items:center;gap:10px;
  padding:10px 14px;border-radius:10px;margin-bottom:20px;
  font-size:13px;font-weight:600;
  animation:fadeIn .25s ease;
}
.role-indicator.show{display:flex}
.role-indicator.student{background:var(--green-bg);color:var(--green);border:1px solid #bbf7d0}
.role-indicator.counsellor{background:var(--purple-bg);color:var(--purple);border:1px solid #ddd6fe}
.role-indicator.admin,.role-indicator.superadmin{background:#fff8ec;color:#c8953a;border:1px solid #fde68a}
.role-indicator.unknown{background:var(--sand);color:var(--muted);border:1px solid var(--border)}
.role-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.student .role-dot{background:var(--green)}
.counsellor .role-dot{background:var(--purple)}
.admin .role-dot,.superadmin .role-dot{background:#c8953a}
.unknown .role-dot{background:var(--muted)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* ── Form ── */
.field{margin-bottom:18px}
.field label{
  display:block;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;
  color:var(--muted);margin-bottom:7px;
}
.input-wrap{position:relative}
.input-wrap input{
  width:100%;padding:12px 14px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;font-family:inherit;color:var(--navy);
  outline:none;transition:border-color .15s,box-shadow .15s;
  background:#fff;
}
.input-wrap input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(10,22,40,.08)}
.input-wrap input.detected{border-color:var(--green)}

/* password toggle */
.pw-eye{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:16px;padding:4px;
}

/* ── Submit button ── */
.submit-btn{
  width:100%;padding:13px;border:none;border-radius:10px;
  font-size:14px;font-weight:700;font-family:inherit;
  cursor:pointer;transition:all .2s;margin-top:4px;
  background:var(--navy);color:#fff;
}
.submit-btn:hover{opacity:.88;transform:translateY(-1px)}
.submit-btn:disabled{opacity:.6;transform:none;cursor:not-allowed}
.submit-btn.student{background:var(--green)}
.submit-btn.counsellor{background:var(--purple)}
.submit-btn.admin,.submit-btn.superadmin{background:#c8953a}

/* ── Alert ── */
.alert{
  padding:11px 14px;border-radius:8px;font-size:13px;
  margin-bottom:16px;display:none;line-height:1.5;
}
.alert.show{display:block}
.alert.error{background:var(--red-bg);color:#991b1b;border:1px solid #fecaca}
.alert.success{background:var(--green-bg);color:#166534;border:1px solid #bbf7d0}

/* ── Footer links ── */
.card-footer{margin-top:24px;text-align:center;font-size:13px;color:var(--muted)}
.card-footer a{color:var(--navy);font-weight:600;text-decoration:none}
.card-footer a:hover{text-decoration:underline}

/* ── Divider ── */
.divider{
  display:flex;align-items:center;gap:12px;
  margin:20px 0;color:var(--muted);font-size:12px;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Social buttons ── */
.social-row{display:flex;flex-direction:column;gap:10px}
.social-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:11px;border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border);background:#fff;
  font-family:inherit;color:var(--navy);transition:all .15s;
}
.social-btn:hover{background:var(--sand);border-color:#ccc}

/* ── Loading spinner ── */
.spinner{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .6s linear infinite;
  vertical-align:middle;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Background label ── */
.bg-label{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  font-size:12px;color:rgba(255,255,255,.4);
  pointer-events:none;letter-spacing:.5px;
}
</style>
</head>
<body id="body">

<div class="card" id="card">
  <div class="logo">Edu<span>Mitra</span></div>
  <div class="tagline" id="tagline">Welcome back. Sign in to continue.</div>

  <!-- Role indicator -->
  <div class="role-indicator" id="roleIndicator">
    <div class="role-dot"></div>
    <span id="roleText">Detected role</span>
  </div>

  <!-- Alert -->
  <div class="alert" id="alert"></div>

  <!-- Email field -->
  <div class="field">
    <label>Email Address</label>
    <div class="input-wrap">
      <input
        type="email" id="emailInput"
        placeholder="Enter your email"
        autocomplete="email"
        oninput="onEmailInput()"
        onblur="detectRole()"
      >
    </div>
  </div>

  <!-- Password field (hidden until role detected) -->
  <div class="field" id="passwordField" style="display:none">
    <label>Password</label>
    <div class="input-wrap">
      <input
        type="password" id="passwordInput"
        placeholder="Enter your password"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()"
      >
      <button class="pw-eye" type="button" onclick="togglePw()" tabindex="-1">👁</button>
    </div>
  </div>

  <!-- Submit -->
  <button class="submit-btn" id="submitBtn" onclick="doLogin()" style="display:none">
    Sign In
  </button>

  <!-- Continue with email button (shown first) -->
  <button class="submit-btn" id="continueBtn" onclick="detectRole()" style="margin-top:4px">
    Continue →
  </button>

  <div class="divider" id="socialDivider">or</div>

  <div class="social-row" id="socialRow">
    <button class="social-btn" onclick="window.location.href='/auth/google'">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 6.294C4.672 4.169 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <button class="social-btn" onclick="window.location.href='/auth/linkedin'">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect width="18" height="18" rx="3" fill="#0077B5"/><path d="M5.5 7.5h-2v5h2v-5zM4.5 6.5a1 1 0 100-2 1 1 0 000 2zM13.5 12.5h-2v-2.5c0-.828-.672-1.5-1.5-1.5s-1.5.672-1.5 1.5v2.5h-2v-5h2v.8c.4-.55 1.1-.8 1.75-.8 1.24 0 2.25 1.01 2.25 2.25v2.75z" fill="#fff"/></svg>
      Continue with LinkedIn
    </button>
  </div>

  <div class="card-footer" id="cardFooter" style="margin-top:20px">
    New to EduMitra? <a href="/">Sign up on the homepage</a>
  </div>
</div>

<div class="bg-label" id="bgLabel">EduMitra</div>

<script>
let _detectedRole = null;
let _detectTimer = null;

const roleConfig = {
  superadmin: { label: 'Super Admin Portal', btn: 'Sign in as Super Admin', tagline: 'Welcome back, Super Admin.' },
  admin:      { label: 'Admin Portal',        btn: 'Sign in as Admin',       tagline: 'Welcome back, Admin.' },
  counsellor: { label: 'Counsellor Portal',   btn: 'Sign in as Counsellor',  tagline: 'Welcome back, Counsellor.' },
  student:    { label: 'Student Portal',      btn: 'Sign in →',              tagline: 'Welcome back! Ready to continue your journey?' },
  unknown:    { label: 'Account not found — check your email', btn: null,    tagline: 'Sign in to EduMitra.' }
};

function onEmailInput() {
  // Reset if email changes after role was detected
  if (_detectedRole) {
    clearRole();
  }
  clearTimeout(_detectTimer);
  const email = document.getElementById('emailInput').value.trim();
  if (email.includes('@') && email.includes('.')) {
    _detectTimer = setTimeout(detectRole, 600);
  }
}

async function detectRole() {
  const email = document.getElementById('emailInput').value.trim();
  if (!email || !email.includes('@')) return;

  try {
    const res = await fetch('/api/detect-role', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    applyRole(data.role, email);
  } catch(e) {
    // Server unreachable — still show password field
    applyRole('unknown', email);
  }
}

function applyRole(role, email) {
  _detectedRole = role;
  const body = document.getElementById('body');
  const indicator = document.getElementById('roleIndicator');
  const roleText = document.getElementById('roleText');
  const submitBtn = document.getElementById('submitBtn');
  const continueBtn = document.getElementById('continueBtn');
  const passwordField = document.getElementById('passwordField');
  const tagline = document.getElementById('tagline');
  const bgLabel = document.getElementById('bgLabel');
  const emailInput = document.getElementById('emailInput');

  // Remove all role classes
  body.className = '';
  indicator.className = 'role-indicator';
  submitBtn.className = 'submit-btn';

  const cfg = roleConfig[role] || roleConfig.unknown;

  if (role === 'unknown') {
    indicator.className = 'role-indicator unknown show';
    roleText.textContent = cfg.label;
    passwordField.style.display = 'none';
    submitBtn.style.display = 'none';
    continueBtn.style.display = 'block';
    continueBtn.textContent = 'Continue →';
    return;
  }

  // Known role
  body.classList.add('role-' + role);
  indicator.classList.add('show', role);
  roleText.textContent = cfg.label;
  tagline.textContent = cfg.tagline;
  bgLabel.textContent = cfg.label;
  emailInput.classList.add('detected');

  // Show password field
  passwordField.style.display = 'block';
  continueBtn.style.display = 'none';
  submitBtn.style.display = 'block';
  submitBtn.classList.add(role);
  submitBtn.textContent = cfg.btn;

  // Hide social buttons for admin/counsellor
  const showSocial = role === 'student';
  document.getElementById('socialDivider').style.display = showSocial ? 'flex' : 'none';
  document.getElementById('socialRow').style.display = showSocial ? 'flex' : 'none';

  // Focus password field
  setTimeout(() => document.getElementById('passwordInput').focus(), 100);
}

function clearRole() {
  _detectedRole = null;
  document.getElementById('body').className = '';
  document.getElementById('roleIndicator').className = 'role-indicator';
  document.getElementById('passwordField').style.display = 'none';
  document.getElementById('submitBtn').style.display = 'none';
  document.getElementById('continueBtn').style.display = 'block';
  document.getElementById('continueBtn').textContent = 'Continue →';
  document.getElementById('emailInput').classList.remove('detected');
  document.getElementById('socialDivider').style.display = 'flex';
  document.getElementById('socialRow').style.display = 'flex';
  document.getElementById('tagline').textContent = 'Welcome back. Sign in to continue.';
  document.getElementById('bgLabel').textContent = 'EduMitra';
  hideAlert();
}

async function doLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;

  if (!email) { showAlert('Please enter your email address.', 'error'); return; }
  if (!password) { showAlert('Please enter your password.', 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Signing in...';
  hideAlert();

  const endpointByRole = {
    student: '/api/auth/login',
    counsellor: '/api/counsellor/login',
    admin: '/api/admin/login',
    superadmin: '/api/admin/login'
  };
  const endpoint = endpointByRole[_detectedRole] || '/api/auth/login';

  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) {
      showAlert(data.error || 'Invalid email or password.', 'error');
      btn.disabled = false;
      btn.textContent = roleConfig[_detectedRole]?.btn || 'Sign In';
      return;
    }

    // Success — redirect based on the real user object the server returned
    showAlert('Signed in! Redirecting...', 'success');
    const user = data.user || {};
    const redirectByRole = {
      student: user.approved ? '/dashboard.html' : '/?pending=1',
      counsellor: '/counsellor.html',
      admin: '/admin.html',
      superadmin: '/admin.html'
    };
    const target = redirectByRole[user.role] || '/';
    setTimeout(() => { window.location.href = target; }, 600);

  } catch(e) {
    showAlert('Could not reach the server. Make sure it is running.', 'error');
    btn.disabled = false;
    btn.textContent = roleConfig[_detectedRole]?.btn || 'Sign In';
  }
}

function togglePw() {
  const inp = document.getElementById('passwordInput');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = 'alert show ' + type;
}
function hideAlert() {
  document.getElementById('alert').className = 'alert';
}

// Auto-detect if already logged in
(async function() {
  try {
    const r = await fetch('/api/me');
    const d = await r.json();
    if (!d.loggedIn) return;
    const role = d.user.role;
    if (role === 'superadmin' || role === 'admin') window.location.replace('/admin.html');
    else if (role === 'counsellor') window.location.replace('/counsellor.html');
    else if (role === 'student' && d.user.approved) window.location.replace('/dashboard.html');
  } catch(e) {}
})();
</script>
</body>
</html>
